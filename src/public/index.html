<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <base href="/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="./assets/minepanel-logo-BuEwVKa1.svg" />
  <title>MinePanel — Server Management</title>
  <!-- Browser chrome tint follows system appearance; matches --bg-base themes -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff2f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Minecraft server management panel." />
  <script>
    (function(){
      var t=localStorage.getItem('mp_theme');
      if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
      try {
        var a=localStorage.getItem('mp_accent');
        if(a){
          var r=document.documentElement;
          // Support both hsl(H,S%,L%) and hsl(H S% L%)
          var mh=a.match(/hsl\((\d+)[,\s]+([\d.]+)%[,\s]+([\d.]+)%/);
          if(mh){
            var h=+mh[1],s=+mh[2],l=+mh[3];
            var lh=Math.min(100,l+8);
            r.style.setProperty('--accent','hsl('+h+','+s+'%,'+l+'%)');
            r.style.setProperty('--accent-hover','hsl('+h+','+s+'%,'+lh+'%)');
            r.style.setProperty('--accent-glow','hsla('+h+','+s+'%,'+l+'%,0.15)');
            r.style.setProperty('--accent-subtle','hsla('+h+','+s+'%,'+l+'%,0.08)');
            r.style.setProperty('--green','hsl('+h+','+s+'%,'+l+'%)');
          }
        }
      } catch(e){}
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-dNUcK3d0.js"></script>

  <link rel="modulepreload" crossorigin href="./assets/codemirror-langs-DUkdpwAd.js">
  <link rel="stylesheet" crossorigin href="./assets/index-C6g4p0XD.css">
</head>

</body>
</html>
